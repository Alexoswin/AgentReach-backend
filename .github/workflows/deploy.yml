name: Build & Deploy

# Builds the Docker image, pushes it to Docker Hub, then deploys that exact
# image to Cloud Run. Run it manually from the Actions tab ("Run workflow")
# with the main branch selected.
on:
  workflow_dispatch:

# Queue deploys instead of running two at once against the same service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/agentreach-backend
  SERVICE: agentreach-backend
  REGION: asia-south1

jobs:
  build-and-deploy:
    # A manual run started from any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for GCP Workload Identity Federation

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          # Optional: the service's runtime env in .env format. When set, it
          # replaces all env vars on the service; when empty, existing env vars
          # on the service are left untouched.
          CLOUD_RUN_ENV: ${{ secrets.CLOUD_RUN_ENV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          for name in JWT_SECRET FIREBASE_PROJECT_ID GOOGLE_CLOUD_PROJECT; do
            [ -n "${!name}" ] || { echo "::error::secrets.$name is not set"; exit 1; }
          done
          env_flag=()
          if [ -n "$CLOUD_RUN_ENV" ]; then
            python3 - "$RUNNER_TEMP/cloud-run-env.json" <<'PY'
          import json, os, sys

          env = {}
          for raw in os.environ["CLOUD_RUN_ENV"].splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[len("export "):].lstrip()
              key, sep, value = line.partition("=")
              key, value = key.strip(), value.strip()
              if not sep or not key:
                  continue
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              # PORT is reserved: Cloud Run sets it and rejects deploys that do.
              if key == "PORT":
                  continue
              env[key] = value

          # Keep Identity Platform project settings in the deployment even
          # when CLOUD_RUN_ENV is managed as one consolidated secret.
          for key in ("JWT_SECRET", "FIREBASE_PROJECT_ID", "GOOGLE_CLOUD_PROJECT"):
              value = os.environ.get(key, "").strip()
              if value:
                  env[key] = value

          with open(sys.argv[1], "w") as f:
              json.dump(env, f)
          PY
            env_flag=(--env-vars-file "$RUNNER_TEMP/cloud-run-env.json")
          fi

          # Scales to zero to keep cost down. Trade-off: the in-process @Cron
          # jobs (campaign launcher, signal collectors)
          # only run while an instance is up serving traffic. Capped at one
          # instance so call WebSocket state stays in a single process and a
          # cron never fires from two copies at once. For always-on behaviour
          # switch to --min-instances 1 and --no-cpu-throttling.
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 1 \
            --cpu-throttling \
            --cpu-boost \
            --timeout 3600 \
            --allow-unauthenticated \
            "${env_flag[@]}" \
            --quiet
